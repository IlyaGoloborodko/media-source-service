services:
  media-source-service:
    build: .
    container_name: media-source-service
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${MSS_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
